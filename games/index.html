<!doctype html>
<html lang="en-GB" class="scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111d" />
    <meta
      id="hub-meta"
      name="description"
      content="KANE · Game picker — fantasy RTS and more."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>KANE · Game picker</title>
    <script>
      // Links into Kane from before it moved to /kane/ (e.g. /#admin) keep working.
      if (location.hash) location.replace('./kane/' + location.search + location.hash);
    </script>
  </head>
  <body class="min-h-screen bg-night font-arcade text-ink">
    <main
      class="mx-auto max-w-[920px] px-[max(20px,env(safe-area-inset-left))] py-[max(28px,env(safe-area-inset-top))]"
    >
      <header class="text-center">
        <div class="mb-5 flex items-center justify-end gap-2">
          <span id="hub-locale-label" class="text-xs text-subtle">Language</span>
          <div id="hub-locale" class="flex gap-2"></div>
        </div>
        <h1 id="hub-title" class="text-[clamp(32px,7vw,48px)] font-bold tracking-[-1.5px]">Games</h1>
        <p id="hub-subtitle" class="mt-2 mb-7 text-muted">Pick a game to play.</p>
      </header>
      <ul id="game-list" class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-5"></ul>
      <footer class="mt-8 flex justify-center gap-6">
        <a id="hub-privacy" class="inline-flex min-h-12 items-center text-subtle underline" href="/privacy.html">Privacy</a>
        <a id="hub-terms" class="inline-flex min-h-12 items-center text-subtle underline" href="/terms.html">Terms</a>
      </footer>
    </main>
    <script type="module" src="./hub/hub.ts"></script>
  </body>
</html>
