<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#5a1d7a"/>
      <stop offset="0.55" stop-color="#2a1050"/>
      <stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#ffd23f" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Night sky with a magenta glow -->
  <rect width="500" height="300" fill="url(#sky)"/>

  <!-- Sunburst behind the shield -->
  <g stroke="#ffd23f" stroke-width="16" stroke-linecap="round" opacity="0.13">
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(0 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(22.5 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(45 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(67.5 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(90 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(112.5 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(135 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(157.5 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(180 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(202.5 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(225 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(247.5 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(270 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(292.5 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(315 250 150)"/>
    <line x1="250" y1="150" x2="250" y2="-60" transform="rotate(337.5 250 150)"/>
  </g>

  <!-- Halftone burst in the top-right corner -->
  <polygon points="330,0 500,0 500,170 380,95" fill="url(#dots)"/>

  <!-- Back hill and front hill, comic outlines -->
  <path d="M0 232 Q120 168 235 212 T500 196 L500 300 L0 300 Z" fill="#1d3f8f" stroke="#0b1220" stroke-width="6" stroke-linejoin="round"/>
  <path d="M0 262 Q150 214 300 250 T500 240 L500 300 L0 300 Z" fill="#0f6470" stroke="#0b1220" stroke-width="6" stroke-linejoin="round"/>

  <!-- Castle on the left -->
  <g stroke="#0b1220" stroke-width="5" stroke-linejoin="round">
    <rect x="40" y="145" width="28" height="80" fill="#f6e7c1"/>
    <rect x="118" y="140" width="30" height="85" fill="#f6e7c1"/>
    <rect x="70" y="120" width="50" height="105" fill="#f6e7c1"/>
    <polygon points="38,145 54,116 70,145" fill="#ff5fa2"/>
    <polygon points="116,140 133,110 150,140" fill="#ff5fa2"/>
    <rect x="70" y="110" width="10" height="11" fill="#f6e7c1"/>
    <rect x="84" y="110" width="10" height="11" fill="#f6e7c1"/>
    <rect x="98" y="110" width="10" height="11" fill="#f6e7c1"/>
    <rect x="112" y="110" width="10" height="11" fill="#f6e7c1"/>
    <line x1="95" y1="110" x2="95" y2="82" stroke-width="4"/>
    <polygon points="95,82 122,91 95,100" fill="#ffd23f" stroke-width="3"/>
  </g>
  <path d="M88 225 V199 Q88 186 95 186 Q102 186 102 199 V225 Z" fill="#0b1220"/>

  <!-- Crossed swords behind the shield -->
  <g stroke="#0b1220" stroke-width="5" stroke-linejoin="round">
    <g transform="rotate(35 250 150)">
      <rect x="244" y="40" width="12" height="190" rx="3" fill="#e8f1ff"/>
      <rect x="226" y="200" width="48" height="10" rx="4" fill="#ffd23f"/>
      <rect x="247" y="210" width="6" height="28" fill="#7a3b1a"/>
    </g>
    <g transform="rotate(-35 250 150)">
      <rect x="244" y="40" width="12" height="190" rx="3" fill="#e8f1ff"/>
      <rect x="226" y="200" width="48" height="10" rx="4" fill="#ffd23f"/>
      <rect x="247" y="210" width="6" height="28" fill="#7a3b1a"/>
    </g>
  </g>

  <!-- Shield with a gold cross -->
  <path d="M205 110 H295 V175 Q295 225 250 245 Q205 225 205 175 Z" fill="#ff5fa2" stroke="#0b1220" stroke-width="7" stroke-linejoin="round"/>
  <path d="M220 125 H280 V172 Q280 210 250 226 Q220 210 220 172 Z" fill="#7a1f5c"/>
  <rect x="244" y="130" width="12" height="86" fill="#ffd23f"/>
  <rect x="226" y="160" width="48" height="12" fill="#ffd23f"/>

  <!-- Crown on top of the shield -->
  <polygon points="215,100 225,75 238,92 250,68 262,92 275,75 285,100" fill="#ffd23f" stroke="#0b1220" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="225" cy="75" r="3.5" fill="#ff5fa2"/>
  <circle cx="250" cy="68" r="3.5" fill="#ff5fa2"/>
  <circle cx="275" cy="75" r="3.5" fill="#ff5fa2"/>

  <!-- Sparkles -->
  <g stroke="#0b1220" stroke-width="2" stroke-linejoin="round">
    <path d="M62 44 L65 51 L72 54 L65 57 L62 64 L59 57 L52 54 L59 51 Z" fill="#ffd23f"/>
    <path d="M432 62 L435 69 L442 72 L435 75 L432 82 L429 75 L422 72 L429 69 Z" fill="#7be0ff"/>
    <path d="M402 196 L404 201 L409 203 L404 205 L402 210 L400 205 L395 203 L400 201 Z" fill="#ffffff"/>
  </g>

  <!-- Banner pennants on the hill -->
  <g stroke="#0b1220" stroke-width="3" stroke-linejoin="round">
    <line x1="382" y1="236" x2="382" y2="206" stroke-width="3"/>
    <polygon points="382,206 402,212 382,218" fill="#ff5fa2"/>
    <line x1="424" y1="238" x2="424" y2="210" stroke-width="3"/>
    <polygon points="424,210 443,216 424,222" fill="#ffd23f"/>
  </g>
</svg>
