# Auto-deploy Firebase Hosting when `dev` is updated (incl. PR merges into `dev`).
# Uses secret FIREBASE_SERVICE_ACCOUNT_KANE_RTS_GAME (provisioned by Firebase Hosting GitHub integration).
# See docs/firebase-hosting.md. Does not deploy Firestore rules.
name: Deploy Hosting (dev)

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-hosting-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (tsc + Vite → dist/)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_USE_EMULATORS: ${{ secrets.VITE_FIREBASE_USE_EMULATORS }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANE_RTS_GAME }}

      - name: Deploy Firebase Hosting (kane-web)
        # Matches `npm run hosting:deploy` target; project from `.firebaserc`.
        run: npx --yes firebase-tools@13 deploy --only hosting:kane-web --non-interactive --project kane-rts-game
