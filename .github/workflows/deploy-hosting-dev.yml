# Auto-deploy Firebase Hosting when `dev` is updated (incl. PR merges into `dev`).
# Uses secret FIREBASE_SERVICE_ACCOUNT_KANE_RTS_GAME (provisioned by Firebase Hosting GitHub integration).
# See docs/firebase-hosting.md. Does not deploy Firestore rules.
name: Deploy Hosting (dev)

on:
  push:
    branches:
      - dev

# Deploys queue instead of cancelling: a run cancelled by a newer push is marked
# "cancelled" even when it already released to Hosting. A waiting run is replaced
# by the newest one, which contains the older commits, so the last push still wins.
concurrency:
  group: deploy-hosting-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KANE_RTS_GAME }}

      - name: Build and deploy Firebase Hosting (kane-web)
        # Same as local `npm run hosting:deploy` (tsc + Vite build, then deploy);
        # project and target come from .firebaserc / firebase.json.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_USE_EMULATORS: ${{ secrets.VITE_FIREBASE_USE_EMULATORS }}
        run: npm run hosting:deploy -- --non-interactive

      - name: Check live security headers
        # Detects a bad release, it cannot stop one: the release is already live here.
        # Retries for a few seconds in case the new headers have not reached every edge.
        run: npm run check:headers -- https://kane-rts-game.web.app
